services:
  db-init:
    container_name: fon-raspored-db-init
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the hosted PostgreSQL pooled URL}
      DIRECT_URL: ${DIRECT_URL:-${DATABASE_URL_UNPOOLED:?Set DIRECT_URL or DATABASE_URL_UNPOOLED to the hosted direct URL}}
    # Migrations can run while the development stack's internal network exists.
    network_mode: bridge
    restart: "no"

  app:
    container_name: fon-raspored
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:?Set the Clerk publishable key}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the hosted PostgreSQL pooled URL}
      DIRECT_URL: ${DIRECT_URL:-${DATABASE_URL_UNPOOLED:?Set DIRECT_URL or DATABASE_URL_UNPOOLED to the hosted direct URL}}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?Set the Clerk secret key}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:?Set the Clerk publishable key}
    ports:
      - "${APP_PORT:-3000}:3000"
    networks:
      backend:
      dev-proxy:
        aliases:
          - fon-raspored
    depends_on:
      db-init:
        condition: service_completed_successfully

networks:
  backend:
  dev-proxy:
    external: true
    name: dev-proxy
