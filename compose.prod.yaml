services:
  postgres:
    container_name: fon-raspored-postgres
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fon_raspored}
      POSTGRES_USER: ${POSTGRES_USER:-fon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fon_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    networks:
      - backend
      - db-access
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$$POSTGRES_PASSWORD\" psql -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -c 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  db-init:
    container_name: fon-raspored-db-init
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fon}:${POSTGRES_PASSWORD:-fon_password}@postgres:5432/${POSTGRES_DB:-fon_raspored}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-fon}:${POSTGRES_PASSWORD:-fon_password}@postgres:5432/${POSTGRES_DB:-fon_raspored}?schema=public
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    container_name: fon-raspored
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fon}:${POSTGRES_PASSWORD:-fon_password}@postgres:5432/${POSTGRES_DB:-fon_raspored}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-fon}:${POSTGRES_PASSWORD:-fon_password}@postgres:5432/${POSTGRES_DB:-fon_raspored}?schema=public
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
    ports:
      - "${APP_PORT:-3000}:3000"
    networks:
      backend:
      dev-proxy:
        aliases:
          - fon-raspored
    depends_on:
      db-init:
        condition: service_completed_successfully

volumes:
  postgres-data:

networks:
  backend:
    internal: true
  db-access:
  dev-proxy:
    external: true
    name: dev-proxy
